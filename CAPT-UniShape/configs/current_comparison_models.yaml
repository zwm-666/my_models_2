# Current comparison experiment configuration for updated processed dataset.
# Data: data/processed/self_seed44_{8_2,7_3,6_4,5_5}.npz
# Results: results/updated_dataset_ratio_and_baseline_comparison_summary_20260513

dataset:
  source_pattern: data/processed/self_seed44_{ratio}.npz
  ratios: ["8_2", "7_3", "6_4", "5_5"]
  seed: 44
  refit_trainval: false
  comparison_protocol: independent_processed_splits

proposed:
  config_file: configs/proposed.yaml
  model_name: official_capt_unishape_rbf_kanfusion
  d_model: 128
  hidden_dim: 256
  fusion_hidden_dim: 256
  dropout: 0.1
  use_rbf_head: true
  num_rbf_centers: 16
  use_residual_kan_fusion: true
  kan_bottleneck_dim: 32
  kan_num_basis: 8
  kan_lambda: 0.1
  learnable_kan_lambda: true
  channel_aggregation: attention
  scale_len: 3
  batch_size: 32
  epochs: 80
  patience: 10
  min_delta: 0.0001
  min_epochs_before_stop: 20
  val_metric_smoothing: 3
  class_weighting_default: sqrt_balanced
  lr: 0.0001
  weight_decay: 0.0001
  checkpoint_selection: best_val
  selection_score_default: macro_f1
  ratio_overrides:
    6_4:
      setting_name: proposed_clean_checkpoint_finetune_6_4
      init_checkpoint: null
      epochs: 12
      patience: 4
      min_epochs_before_stop: 4
      lr: 0.00002
      weight_decay: 0.0002
      checkpoint_selection: best_val
      selection_score: macro_f1
    5_5:
      class_weighting: logit_adjusted
      selection_score: macro_f1_class0_recall

baselines:
  xgboost:
    setting_name: segment_xgboost_eis_cond_pca4
    input_protocol: segment_level_non_window
    feature_scope: x_eis+x_cond
    feature_protocol: group_id segment statistics of x_eis+x_cond -> PCA(n_components=4) -> XGBClassifier
    segment_statistics: [mean, std, max]
    use_scaler: false
    pca_components: 4
    classifier: XGBClassifier
    n_estimators: 80
    max_depth: 2
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    objective: multi:softprob
    eval_metric: mlogloss
    tree_method: hist
    random_state: 44
  lightgbm:
    setting_name: segment_lightgbm_eis_cond_pca4_stump
    input_protocol: segment_level_non_window
    feature_scope: x_eis+x_cond
    feature_protocol: group_id segment statistics of x_eis+x_cond -> PCA(n_components=4) -> LGBMClassifier
    segment_statistics: [mean, std, max]
    use_scaler: false
    pca_components: 4
    classifier: LGBMClassifier
    n_estimators: 40
    max_depth: 1
    num_leaves: 3
    learning_rate: 0.03
    subsample: 0.7
    colsample_bytree: 0.7
    objective: multiclass
    random_state: 44
  mlp:
    setting_name: compact_torch_mlp_cond_only
    feature_scope: x_cond_only
    hidden_dim: 12
    epochs: 18
    patience: 4
    min_epochs_before_stop: 6
    dropout: 0.5
    lr: 0.0005
    weight_decay: 0.0015
    class_weighting: sqrt_balanced
    batch_size: 32
  tcn:
    setting_name: compact_tcn_op_cond_small
    feature_scope: x_op+x_cond
    hidden_dim: 6
    epochs: 7
    patience: 4
    min_epochs_before_stop: 5
    dropout: 0.6
    lr: 0.00045
    weight_decay: 0.002
    class_weighting: sqrt_balanced
    batch_size: 32
  autoformer:
    setting_name: compact_autoformer_op_cond_small
    feature_scope: x_eis_only
    d_model: 8
    num_layers: 1
    moving_avg_kernel: 5
    epochs: 12
    patience: 4
    min_epochs_before_stop: 6
    dropout: 0.6
    lr: 0.0005
    weight_decay: 0.002
    class_weighting: sqrt_balanced
    batch_size: 32

excluded_models:
  - lstm
