# ===========================================================================
# Experiment configuration
# ===========================================================================
# Settings for the evaluation pipeline and robustness experiments.

task_name: "pemfc_fault_classification"
run_name: ""              # Auto-generated from mode + timestamp if empty
save_dir: "outputs"

# --- Evaluation dimensions ---
evaluate_cross_condition: true    # Test on unseen operating conditions
evaluate_noise: true              # Test under additive noise / missing data
evaluate_small_sample: true       # Test with reduced label availability
evaluate_imbalance: true          # Test with skewed class distributions

# --- Noise robustness settings ---
noise_snr_levels: [30, 20, 10]            # Signal-to-noise ratios (dB)
noise_missing_ratios: [0.05, 0.10, 0.20]  # Fraction of randomly zeroed values

# --- Few-shot / small-sample settings ---
label_ratios: [0.1, 0.2, 0.5, 1.0]       # Fraction of labelled training data

# --- Class imbalance settings ---
imbalance_ratios: [5, 10, 20]             # Max majority-to-minority ratio
