# ===========================================================================
# Dataset configuration -- CSV-based PEMFC Fault Classification
# ===========================================================================
# For loading directly from a CSV file with automatic feature engineering.

# --- Data source ---
csv_path: "data/processed/eis_pemfc_dataset.csv"
data_format: "csv"          # "csv" uses build_csv_dataset; "npz" uses PEMFCDataset
label_col: "State"

# --- Sliding window ---
window_size: 64
stride_train: 12            # Dense stride for training (more samples)
stride_eval: 32             # Sparser stride for evaluation

# --- Split ratios ---
test_size: 0.20
val_size: 0.15
augment_train: true          # Online augmentation during training

# --- Channel counts (auto-detected at runtime) ---
# op_cols and cond_cols are auto-detected from the CSV when not specified.
# op_channels is overridden at runtime by build_csv_dataset().
op_channels: 59             # placeholder, auto-updated
eis_channels: 4
eis_freq_points: 32

# --- Operating conditions (auto-detected from CSV) ---
# condition_fields are auto-detected at runtime for generic column names.
condition_fields: []

# --- Labels ---
coarse_labels:
  - "Normal"
  - "Dry"
  - "Wet"
label_granularity: "coarse"

# --- Normalisation ---
normalize: true

# --- Paths ---
data_dir: "data"
split_dir: "data/splits"
