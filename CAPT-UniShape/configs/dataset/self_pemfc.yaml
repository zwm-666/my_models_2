# ===========================================================================
# Dataset configuration -- Self-measured PEMFC data (测试数据.xlsx)
# ===========================================================================
# Explicit column mapping:
#   x_op  = 216 single-cell voltages (单片1..单片216)
#   cond  = 9 impedance/EIS statistics + 3 stack variables (12 dims)
#   label = 类型
# Split strategy: group-stratified by 测试时间 (no data leakage)

# --- Data source ---
self_excel_path: "data/raw/测试数据.xlsx"
self_sheet_name: "Sheet1"
data_format: "self"

# --- Sliding window ---
# One Excel file can contain multiple locally continuous test segments.
# segment mode starts a new group at large time gaps or label boundaries, so
# windows are never built across discontinuous experiments or classes.
group_mode: "segment"
segment_gap_seconds: 600.0
segment_block_seconds: 600.0
segment_label_boundary: true
window_size: 32
stride_train: 8
stride_eval: 16

# --- Split ratios (group-level, not row-level) ---
test_size: 0.20
val_size: 0.15
augment_train: true

# --- Channel counts (fixed, not auto-detected) ---
op_channels: 216             # 216 single-cell voltages
eis_channels: 4              # placeholder (EIS branch disabled)
eis_freq_points: 32          # placeholder

# --- Condition dimensions ---
condition_fields:
  - "总阻抗"
  - "平均阻抗"
  - "最高阻抗"
  - "次高阻抗"
  - "最低阻抗"
  - "次低阻抗"
  - "标准差"
  - "EIS电阻实部"
  - "EIS电阻虚部"
  - "电堆总电压"
  - "电堆总电流"
  - "电堆功率"

# --- Labels ---
coarse_labels:
  - "正常"
  - "过湿"
  - "过干"
label_granularity: "coarse"

# --- Normalisation ---
normalize: true

# --- Paths ---
data_dir: "data"
split_dir: "data/splits"
