model_name: "capt_unishape_kan"
head_type: "capt_kan"

d_model: 256
num_layers: 4
num_heads: 8
dropout: 0.1

scale_set: [32, 64, 128]
use_eis_branch: true
use_condition_attention: true
use_cross_modal: true
use_capt: true

eis_segment_lengths: [8, 16, 32]
fusion_hidden_dim: 256
modality_dropout: 0.1

temperature: 0.07
num_classes: 3

kan_hidden_dim: 96
kan_num_basis: 8
kan_mode: "shared_kan"
use_kan_score_head: false
transport_scale_init: 0.02
condition_dropout: 0.1

use_cb_loss: true
class_balance_loss: "balanced_softmax"
use_transport_reg: true
use_residual_consistency: true
