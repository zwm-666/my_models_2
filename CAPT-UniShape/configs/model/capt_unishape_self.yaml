# ===========================================================================
# Model configuration -- CAPT-UniShape for self-measured PEMFC data
# ===========================================================================
# 216 single-cell voltage channels, 12-dim condition vector, no EIS branch.

# --- Core Transformer dimensions ---
d_model: 256
num_layers: 4
num_heads: 8
dropout: 0.15

# --- Multi-scale partition (for window_size=32) ---
scale_set: [4, 8, 16]

# --- Branch switches ---
use_eis_branch: false
use_condition_attention: true
use_cross_modal: false
use_capt: true

# --- EIS adapter (placeholder, not used) ---
eis_segment_lengths: [8, 16]

# --- Fusion ---
fusion_hidden_dim: 256
modality_dropout: 0.0

# --- CAPT classification head ---
capt_hidden_dim: 64
temperature: 0.07
num_classes: 3

# --- Auxiliary loss switches ---
use_cb_loss: true
use_transport_reg: true
use_residual_consistency: true
