_base_:
  - "configs/dataset/heuristic_multimodal.yaml"
  - "configs/model/capt_unishape_kan_multimodal3.yaml"
  - "configs/experiment/default.yaml"

optimizer: "adamw"
lr: 3.0e-4
weight_decay: 1.0e-4
batch_size: 8
num_workers: 0

max_epochs: 20
warmup_epochs: 5
grad_clip: 1.0
frozen_epochs: 5

gamma1: 0.01
gamma2: 0.005
gamma3: 0.0
beta: 0.9999

patience: 5
min_delta: 0.001
scheduler: "cosine"
pretrain_checkpoint: ""
seeds: [42]
