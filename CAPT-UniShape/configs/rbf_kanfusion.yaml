model_name: official_capt_unishape_rbf_kanfusion
use_rbf_head: true
use_residual_kan_fusion: true

# Input definition: operation sequence, EIS spectrum and stack condition vector.
c_op: 6
op_seq_len: 256
c_eis: 4
eis_seq_len: 128
d_cond: 10
num_classes: 3

# Shared representation size.
d_model: 128
hidden_dim: 256
fusion_hidden_dim: 256
dropout: 0.1

# Official UniShape wrapper.
freeze_unishape_backbone: false
channel_aggregation: attention
scale_len: 3

# Residual KAN-Fusion.
kan_bottleneck_dim: 32
kan_num_basis: 8
kan_lambda: 0.1
learnable_kan_lambda: true

# RBF condition-aware prototype head.
temperature: 0.07
num_rbf_centers: 16
use_condition_transport: true
alpha_transport: 0.001
alpha_sep: 0.001
alpha_kan: 0.0001
label_smoothing: 0.0

experiment:
  output_dir: results/official_unishape_rbf_kanfusion
  seeds: [42]
  batch_size: 32
  epochs: 5
  patience: 10
  min_delta: 0.0001
  refit_trainval: false
  min_epochs_before_stop: 20
  val_metric_smoothing: 1
  class_weighting: balanced
  lr: 0.0001
  weight_decay: 0.0001
